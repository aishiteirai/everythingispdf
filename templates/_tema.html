{# Controle de tema. Os tres icones vao no HTML e o CSS mostra o do estado
   atual conforme :root[data-tema], entao o icone certo aparece sem depender
   de JavaScript ter rodado. #}
<button type="button" id="tema" class="controle-tema"
        aria-label="Alternar tema entre automático, claro e escuro"
        title="Alternar tema">
    <svg class="icone-tema icone-auto" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8"/>
        <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>
    </svg>
    <svg class="icone-tema icone-claro" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
    </svg>
    <svg class="icone-tema icone-escuro" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
        <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.8 6.8 0 0 0 9.5 9.5z"/>
    </svg>
</button>
