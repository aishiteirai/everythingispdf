name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      # A suíte usa o dublê em tests/bin/libreoffice, então não instala
      # LibreOffice aqui de propósito -- garante que ela roda sem ele.
      # Werkzeug parseia o multipart do upload e o gunicorn recebe a
      # requisicao: sao os dois componentes que este servico nao pode deixar
      # envelhecer. Se uma CVE nova aparecer sem correcao disponivel, o escape
      # e `--ignore-vuln GHSA-xxxx` com o motivo no commit.
      - name: Lint
        run: ruff check .

      - name: Auditoria de dependencias
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Testes
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # gallery.js nao toca DOM nem rede, entao reordenar e girar sao
      # verificaveis sem navegador. Runner nativo do Node, sem dependencia.
      - name: Testes de JavaScript
        run: node --test tests/js/*.test.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t everythingispdf .

      - name: Sobe o container
        run: |
          docker run -d --name app -p 10000:10000 everythingispdf
          for i in $(seq 1 60); do
            if curl -fs http://localhost:10000/health > /dev/null; then
              echo "app respondendo"
              exit 0
            fi
            sleep 2
          done
          echo "app nao subiu em 120s"
          docker logs app
          exit 1

      # Conversão de verdade, com o LibreOffice da imagem. É o que a suíte
      # com dublê nao cobre.
      - name: Converte um DOCX real
        run: |
          python -m pip install --quiet python-docx
          python -c "
          import docx
          d = docx.Document()
          d.add_paragraph('teste de conversao')
          d.save('amostra.docx')
          "
          curl -fs -F 'file=@amostra.docx' \
            http://localhost:10000/api/convert -o saida.pdf
          head -c 5 saida.pdf | grep -q '%PDF-' && echo "PDF valido"
          test -s saida.pdf

      - name: Converte um PNG real
        run: |
          python -m pip install --quiet pillow
          python -c "
          from PIL import Image
          Image.new('RGBA', (40, 40), (255, 0, 0, 128)).save('amostra.png')
          "
          curl -fs -F 'file=@amostra.png' \
            http://localhost:10000/api/convert -o imagem.pdf
          head -c 5 imagem.pdf | grep -q '%PDF-' && echo "PDF valido"

      # Montagem de varias imagens num PDF, com rotacao e pagina A4. A suite
      # de pytest cobre a logica; isto prova o caminho real no container.
      - name: Monta um PDF de duas imagens
        run: |
          python -c "
          from PIL import Image
          Image.new('RGB', (600, 400), (10, 90, 200)).save('p1.png')
          Image.new('RGB', (400, 600), (200, 90, 10)).save('p2.png')
          "
          curl -fs -F 'files=@p1.png' -F 'files=@p2.png' \
            -F 'options={"pages":[{"rotation":0},{"rotation":90}],"size":"a4","margin_mm":10}' \
            http://localhost:10000/api/imgtopdf -o galeria.pdf
          head -c 5 galeria.pdf | grep -q '%PDF-' && echo "PDF valido"
          python -c "
          import re
          dados = open('galeria.pdf', 'rb').read()
          # O append incremental deixa geracoes antigas no arquivo; o /Count da
          # ultima e o numero de paginas que vale.
          total = int(re.findall(rb'/Count\s+(\d+)', dados)[-1])
          assert total == 2, f'esperava 2 paginas, veio {total}'
          print('2 paginas')
          "

      - name: Verifica que nao sobrou temporario
        run: |
          restos=$(docker exec app sh -c 'ls -A /app/temp')
          if [ -n "$restos" ]; then
            echo "vazou temporario: $restos"
            exit 1
          fi
          echo "/app/temp vazio"

      - name: Verifica que nao roda como root
        run: |
          usuario=$(docker exec app whoami)
          test "$usuario" != "root" || { echo "rodando como root"; exit 1; }
          echo "rodando como $usuario"

      # Prova o contador compartilhado. Com memory:// cada worker do gunicorn
      # conta sozinho e o limite efetivo dobra; com Redis, quatro requisicoes
      # num limite de 2 por minuto tem de dar exatamente dois 200 e dois 429.
      # A checagem do DBSIZE e a parte decisiva: prova que o contador foi para
      # o Redis, e nao para a memoria do processo.
      - name: Rate limit compartilhado via Redis
        run: |
          docker network create pdfnet
          docker run -d --name redis --network pdfnet redis:7-alpine
          docker run -d --name applimite --network pdfnet -p 10001:10000 \
            -e RATELIMIT_STORAGE_URI=redis://redis:6379/0 \
            -e "RATE_LIMIT=2 per minute" \
            everythingispdf
          for i in $(seq 1 40); do
            if curl -fs http://localhost:10001/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://localhost:10001/health > /dev/null || {
            echo "app com redis nao subiu"; docker logs applimite; exit 1; }

          codigos=""
          for i in 1 2 3 4; do
            codigos="$codigos $(curl -s -o /dev/null -w '%{http_code}' \
              -F 'file=@amostra.png' http://localhost:10001/api/convert)"
          done
          echo "codigos:$codigos"

          test "$(echo $codigos | tr ' ' '\n' | grep -c 200)" = "2" || {
            echo "esperava exatamente dois 200"; docker logs applimite; exit 1; }
          test "$(echo $codigos | tr ' ' '\n' | grep -c 429)" = "2" || {
            echo "esperava exatamente dois 429"; exit 1; }

          chaves=$(docker exec redis redis-cli DBSIZE | tr -dc '0-9')
          test "$chaves" -gt 0 || {
            echo "redis vazio: o contador nao foi para la"; exit 1; }
          echo "contador no redis ($chaves chaves), limite respeitado entre workers"

      - name: Queda do Redis nao derruba o servico
        run: |
          docker stop redis
          # /health nao tem rate limit, entao nao toca o armazenamento e nao
          # revelaria nada -- foi assim que a primeira versao deste passo
          # falhou. A prova tem de passar por um endpoint limitado.
          #
          # O contador em memoria comeca vazio, entao a primeira conversao
          # depois da queda e permitida: 200 prova que degradou em vez de
          # recusar.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            -F 'file=@amostra.png' http://localhost:10001/api/convert)
          test "$codigo" = "200" || {
            echo "conversao falhou com o redis parado (status $codigo)"
            docker logs applimite; exit 1; }
          docker logs applimite 2>&1 | grep -qi "falling back to in-memory" || {
            echo "sem aviso de fallback no log"; docker logs applimite; exit 1; }
          echo "conversao ok com o redis parado, fallback registrado no log"

      - name: Logs do container
        if: always()
        run: |
          docker logs app
          docker logs applimite 2>/dev/null || true
